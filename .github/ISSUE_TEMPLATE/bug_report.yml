name: Bug report
description: Report a reproducible defect in the agent, simulator, or tooling.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not report security vulnerabilities here;
        use GitHub Private Vulnerability Reporting as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Bazzite version, distribution, or OS release"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Output of: python --version"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Geometry Dash mode involved
      options:
        - Not gameplay-specific
        - Cube
        - Ship
        - Cube/ship transition
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove personal data, paths, and secrets before pasting logs.
      render: shell
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Attach minimal visual evidence if relevant; check it for private data.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private captured content from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true

