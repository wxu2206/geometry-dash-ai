name: Feature request
description: Suggest a focused capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the underlying need, not a timestamp macro or internal game-state
        shortcut. Report security concerns privately according to SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the behavior and how it fits the visual-planning architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you consider?
    validations:
      required: true
  - type: dropdown
    id: v1
    attributes:
      label: V1 relevance
      options:
        - Required for Stereo Madness cube/ship V1
        - Useful for V1 but not required
        - Intended for after V1
        - Unsure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include diagrams, synthetic examples, or links if helpful.

