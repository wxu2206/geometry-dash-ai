schema_version = 1

[capture]
left = 0
top = 0
width = 1280
height = 720
target_fps = 60
# "portal" opens the normal KDE source-selection dialog; it sends no input.
backend = "portal"
preview_scale = 1.0
diagnostic_mode = false
latest_frame_capacity = 1

[control]
enabled = false
emergency_stop_key = "f12"
pause_key = "f10"
manual_override = true
action_interval_ms = 16.667
backend = "portal"
action_key = "space"
tap_duration_ms = 35.0
maximum_hold_ms = 250.0
maximum_actions_per_second = 8
heartbeat_timeout_ms = 250.0
maximum_session_seconds = 1800.0
arming_timeout_seconds = 30.0
maximum_attempts = 25
auto_retry = true
retry_cooldown_seconds = 1.0

[visualization]
enabled = true
show_alternatives = true
show_confidence = true

[recording]
enabled = false
sample_every_n_frames = 30
recent_buffer_seconds = 5.0
preserve_death_context_seconds = 3.0
compress_telemetry = true
maximum_recent_frames = 180

[vision]
player_min_pixels = 16
player_max_pixels = 10000
color_tolerance = 72
mode_history_frames = 5
tracker_max_missing_seconds = 0.5
maximum_velocity_px_s = 5000.0
geometry_min_area_px = 16
geometry_cache_frames = 12
minimum_confidence = 0.35
cube_color = [255, 60, 200]
ship_color = [20, 230, 255]

[calibration]
enabled = true
minimum_observations = 30
learning_rate = 0.05

[planning]
horizon_seconds = 1.25
safety_margin_px = 6.0
uncertainty_weight = 1.0
maximum_jump_delay_frames = 24
delay_increment_frames = 2
maximum_candidates = 16
maximum_obstacles = 128
robustness_window_frames = 1

[logging]
level = "INFO"
directory = "data/runs"
