[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-dash-ai"
version = "0.2.0a1"
description = "A vision-based trajectory-planning agent for Geometry Dash"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "William Xu" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2,<2.3; python_version < '3.14'",
  "numpy>=2,<3; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]
# dbus-next is pure Python.  It drives the *user-approved* ScreenCast portal;
# GStreamer/PipeWire remain existing user-session capabilities, not packages we
# install or configure on the host.
live = ["dbus-next>=0.2.3,<0.3", "mss>=10,<11"]

[project.scripts]
geometry-dash-ai = "geometry_dash_ai.app.cli:main"
geometry-dash-sim = "geometry_dash_ai.simulation.__main__:main"
geometry-dash-observe = "geometry_dash_ai.vision.__main__:main"
geometry-dash-calibrate = "geometry_dash_ai.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["geometry_dash_ai"]
mypy_path = "src"
no_site_packages = true

[[tool.mypy.overrides]]
module = ["dbus_next", "dbus_next.*", "mss", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
